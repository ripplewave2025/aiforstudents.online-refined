<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">

  <!-- ========================= -->
  <!-- SIGNAL STRANDS (CABLES) -->
  <!-- Animate stroke-dashoffset -->
  <!-- ========================= -->

  <g id="signal-strands" fill="none" stroke="#F2F2F2" stroke-width="3">
    <path d="M0 200 C200 120, 300 280, 480 200" />
    <path d="M0 220 C210 160, 310 260, 480 220" />
    <path d="M0 180 C190 140, 290 240, 480 180" />
  </g>

  <!-- ========================= -->
  <!-- CONNECTION NODE -->
  <!-- Lights up on connect -->
  <!-- ========================= -->

  <circle id="connection-node"
          cx="500" cy="200" r="6"
          fill="#F2F2F2" />

  <!-- ========================= -->
  <!-- FREQSET WORDMARK -->
  <!-- Animate opacity + glow -->
  <!-- ========================= -->

  <g id="freqset-wordmark"
     fill="#F2F2F2"
     font-family="Orbitron, Montserrat, Arial, sans-serif"
     font-size="96"
     letter-spacing="8"
     text-anchor="start">

    <text x="520" y="230">FREQSET</text>

  </g>

  <!-- ========================= -->
  <!-- SUBTLE BASELINE WAVE -->
  <!-- Optional animation -->
  <!-- ========================= -->

  <path id="baseline-wave"
        d="M520 260 C580 240, 640 280, 700 260
           S820 240, 880 260"
        fill="none"
        stroke="#F2F2F2"
        stroke-width="2"
        opacity="0.6"/>

</svg>
